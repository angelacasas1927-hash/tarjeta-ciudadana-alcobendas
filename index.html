/* ============================================================
   COLOR TOKENS — iOSBase / MTX iOS Design System
   Source: Figma "Sistema de diseño - Madrid" + SwiftUI SDK values.
   Light mode values (iOS system inverts these ramps for dark mode;
   dark mode was not provided in the source and is not modeled here).
   ============================================================ */

:root {
  /* ---- BRAND (white-label): set --brand per organization at runtime ---- */
  --brand:        #0B4A6B;                 /* active runtime accent (defaults to Alcobendas) */
  --brand-figma:  #0036DB;                 /* Madrid blue — original Figma spec (7.22 AAA) */
  --brand-10:     rgba(11, 74, 107, 0.10); /* selection / active-state tint */
  --brand-08:     rgba(11, 74, 107, 0.08);

  /* Per-organization primaries — swap ONLY --brand (and --brand-10/--brand-08) per client */
  --org-sevilla:    #AB0A3D;   /* burgundy (mobile); web uses #950039 */
  --org-madrid:     #003DF6;   /* Madrid blue */
  --org-quiron:     #003DA5;   /* Quirón Salud blue */
  --org-santander:  #EC0000;   /* Santander red */
  --org-radmas:     #7EA039;   /* green (mobile default); web uses purple #8065D0 */
  --org-alcobendas: #0B4A6B;   /* blue (current runtime accent) */

  /* ---- 8 semantic 12-step ramps (01 lightest → 12 darkest) ----
     Step *-11 is the AAA-checked usable base. Only endpoints are ported here;
     use the ramp step, never a one-off color. */
  --primary-1: #F6FAFF; --primary-2: #EEF5FF; --primary-3: #E6F1FF;   /* PRIMARY (blue) */
  --primary-11: #0B4A6B; --primary-12: #002491;
  --success: #00593B;       /* SUCCESS · success-11 · 7.39 AAA */
  --failure: #A11000;       /* ERROR   · error-11 · 7.12 AAA */
  --alert:   #7D3C00;       /* ALERT   · alert-11 · 7.32 AAA */
  --info:    #005478;       /* INFO    · info-11 · AAA */

  /* ---- Domain status colors (incident/report workflow) — fixed, do not invent.
     Nuevo · Devuelto · En progreso/ejecución · Resuelto · Solucionado ·
     Rechazado · Cancelado. Use in status chips only. ---- */
  --estado-nuevo:       #A8377F;   /* new — magenta/burgundy */
  --estado-devuelto:    #F0BF2E;   /* returned — yellow */
  --estado-progreso:    #F3A32A;   /* in progress/in execution — orange */
  --estado-resuelto:    #2E95CF;   /* resolved — blue */
  --estado-solucionado: #3A8B3E;   /* fixed — green */
  --estado-rechazado:   #E23026;   /* rejected — red */
  --estado-cancelado:   #C62828;   /* cancelled — red */

  /* ---- Neutrals / grayscale ---- */
  --text-primary:   #1C1C1E;               /* primary text */
  --text-secondary: #4F4F55;               /* secondary text · 7.14 AAA */
  --text-tertiary:  rgba(60,60,67,0.30);   /* icons, placeholders, disabled */
  --surface:            #FAFAFA;           /* screen background */
  --surface-card:       #FFFFFF;           /* white card */
  --surface-secondary:  #F2F2F7;           /* subtle section background (systemGray6) */
  --surface-inactive:   #E5E5EA;           /* read/inactive rows (systemGray5) */
  --border:             #D1D1D6;           /* card/button borders (systemGray4) */
  --separator:          rgba(60,60,67,0.12); /* hairlines between rows */
  --shadow:             #AEAEB2;           /* subtle shadows/overlays */
  --system-gray:        #8E8E93;           /* systemGray — muted text/icons (list dates) */
  --system-gray2:       #AEAEB2;           /* systemGray2 */
  --system-gray3:       #C7C7CC;           /* systemGray3 — inactive HomeButton */
  --system-gray4:       #D1D1D6;           /* systemGray4 */
  --system-gray5:       #E5E5EA;           /* systemGray5 — read/inactive rows */
  --system-gray6:       #F2F2F7;           /* systemGray6 — subtle section bg */

  /* ---- Scrims (overlay behind modal surfaces) ---- */
  --scrim-alert: rgba(0,0,0,.8); /* RADAlert — signature dark scrim */
  --scrim-sheet: rgba(0,0,0,.2); /* action sheet / loading overlay */

  /* ---- Aviso (incident report) map-pin status — fixed, semantic (§10.7) ---- */
  --aviso-ejecucion: #4F4F55;   /* en ejecución/en progreso — dark gray bubble */
  --aviso-ok:        #00593B;   /* finalizado OK — green bubble */
  --aviso-nook:      #A11000;   /* finalizado NO OK — red bubble */

  /* ---- Filter-option active state (theme/typology picker) — tokenized, was hardcoded ---- */
  --filter-active-bg:     #FFFBE0;
  --filter-active-border: #6A4700;
}
/* ============================================================
   TYPOGRAPHY TOKENS — iOSBase / MTX iOS Design System
   iOS scale (SF Pro Text) from the "Tipografía iOS" Figma + Poppins as
   the brand accent typeface. SF Pro Text is self-hosted from the
   user-provided .otf files (see tokens/fonts.css @font-face rules),
   with the -apple-system / system-ui stack kept as fallback only.
   Poppins is loaded from Google Fonts in fonts.css (exact match, not
   a substitution).
   ============================================================ */

:root {
  --font-family: "SF Pro Text", -apple-system, system-ui, sans-serif;
  --font-brand:  "Poppins", -apple-system, system-ui, sans-serif; /* labels, chips, section headers */

  /* iOS scale — px size (role → size / default weight) */
  --ios-large-title: 34px; /* Regular */
  --ios-title1:      28px; /* Regular */
  --ios-title2:      22px; /* Regular / Semibold in detail views */
  --ios-title3:      20px; /* Regular */
  --ios-headline:    17px; /* Semibold */
  --ios-body:        17px; /* Regular */
  --ios-callout:     16px; /* Regular */
  --ios-subhead:     15px; /* Regular */
  --ios-footnote:    13px; /* Regular */
  --ios-caption:     12px; /* Regular */
  --ios-caption2:    11px; /* Regular — news-list dates */

  /* Brand (Poppins) */
  --brand-label:   14px; /* SemiBold — button/chip label */
  --brand-title:   20px; /* Medium — section header */

  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;
}
/* ============================================================
   SPACING · RADIUS · ELEVATION — iOSBase / MTX iOS Design System
   Source of truth: RAD-20736 anatomy report (§7 canonical tokens),
   reverse-engineered from the real SwiftUI SDK. The app has no radius
   scale of its own (10+ one-off .cornerRadius() calls); this is the
   deliberate normalization down to 6 buckets — use the named token,
   never a rounded guess.
   ============================================================ */

:root {
  /* ---- Spacing (4pt base, consolidates 3/5/7/10/12/15/20/24/30 found in the SDK) ---- */
  --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
  --screen-margin-h: 16px;  /* resolves grid's 10px vs the rest of the app's 16px */
  --grid-gap: 12px;         /* resolves Home grid's 10px gap */
  --gutter-h: 16px; --gutter-v: 8px; /* legacy alias, kept for existing consumers */

  /* ---- Component radii (canonical 6-bucket scale — §7) ---- */
  --radius-xs: 8px;    /* search bar, datepicker tabs */
  --radius-sm: 12px;   /* media (image thumbs), pickers */
  --radius-card: 14px; /* card chassis, notification, POI, releases image */
  --radius-md: 16px;   /* unified text field, pills, action-sheet top corners */
  --radius-lg: 20px;   /* modals, RADAlert, bottom sheets, twitter card, destacado chips */
  --radius-full: 999px;/* true capsules: RADButton, toast, grabber */
  --radius-chip: 40px; /* RectangularButtonView — real value, not a capsule-of-height guess */

  /* ---- Borders ---- */
  --border-field: 1px; /* resolves 1pt vs 1.5pt found across pickers/fields → 1pt */

  /* ---- Control heights ---- */
  --button-h-primary: 50px;   /* RADButton .filled */
  --button-h-secondary: 48px; /* RADButton .line */

  /* ---- Card chassis shadow (HomeCardContainer — the dominant card pattern) ---- */
  --shadow-card: 0 4px 3px rgba(174,174,178,.6); /* systemGray4 @0.6, blur 3, y4 */

  /* ---- Elevation (4-level Material-style shadow, ported for future sheets/dialogs;
     only elev-1 is exercised by the source — cards/rows) ---- */
  --elev-1: 0 1px 1px rgba(0,0,0,.14), 0 2px 1px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.2);
  --elev-2: 0 6px 10px rgba(0,0,0,.14), 0 1px 18px rgba(0,0,0,.12), 0 3px 5px rgba(0,0,0,.2);
  --elev-3: 0 12px 17px rgba(0,0,0,.14), 0 5px 22px rgba(0,0,0,.12), 0 7px 8px rgba(0,0,0,.2);
  --elev-4: 0 24px 38px rgba(0,0,0,.14), 0 9px 46px rgba(0,0,0,.12), 0 11px 15px rgba(0,0,0,.2);
  --elev-modal: 0 6px 8px rgba(174,174,178,.45); /* bottom sheet / action sheet / twitter card (blur 5-8) */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:#0B1118;font-family:var(--font-family);color:var(--text-primary)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
#screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#screen>*{min-height:0}

/* en pantalla grande, la app se queda centrada con forma de móvil */
@media (min-width:760px){
  body{display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(800px 600px at 20% 0%,rgba(0,78,118,.5),transparent 60%)}
  #app{position:relative;inset:auto;width:402px;height:min(92vh,860px);border-radius:42px;
    border:10px solid #0b0b0d;box-shadow:0 30px 70px rgba(0,0,0,.6)}
}

/* animaciones de navegación */
.in-fwd{animation:inF .28s cubic-bezier(.22,.8,.3,1)}
.in-back{animation:inB .28s cubic-bezier(.22,.8,.3,1)}
.in-fade{animation:inFade .25s ease}
@keyframes inF{from{transform:translateX(26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateX(-26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes nfcPulse{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.35);opacity:0}}

.hs{cursor:pointer}
.hs:active{opacity:.55}
.qr-slot{display:inline-flex}

/* barra de estado: oculta si la app va a pantalla completa, con hora real si no */
/* a pantalla completa la barra de estado del diseño desaparece, pero deja su hueco
   para que la hora y la batería reales del móvil no tapen la cabecera */
body.fullscreen .sysbar>*{display:none!important}
body.fullscreen .sysbar{padding:0!important;height:var(--top);min-height:0;overflow:hidden}

#load{position:absolute;inset:0;z-index:72;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:0;background:var(--surface);color:var(--text-secondary);
  padding:0 32px calc(60px + var(--bot))}
#load.on{display:flex;animation:inFade .18s ease}
#load .ic{width:66px;height:66px;border-radius:16px;display:block;
  box-shadow:0 8px 22px rgba(0,78,118,.28);margin-bottom:26px}
#load .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(0,78,118,.16);
  border-top-color:var(--brand);animation:spin .8s linear infinite;margin-bottom:22px}
#load b{font:600 18px var(--font-family);color:var(--text-primary);text-align:center}
#load i{font:400 14px var(--font-family);font-style:normal;color:var(--text-secondary);
  text-align:center;margin-top:6px}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:absolute;left:16px;right:16px;bottom:calc(26px + var(--bot));background:rgba(28,28,30,.94);
  color:#fff;border-radius:999px;padding:12px 18px;font:500 14px var(--font-family);text-align:center;
  opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1;transform:none}

/* ===== design-system components ===== */
.ds-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;cursor:pointer;
  border-radius:var(--radius-full);padding:9px 18px;font:400 var(--ios-callout) var(--font-family);
  min-height:var(--button-h-primary);background:var(--brand);color:#fff}
.ds-btn-line{min-height:var(--button-h-secondary);background:var(--surface-inactive);color:var(--text-primary)}
.ds-btn-nav{background:var(--brand-10);color:var(--brand)}
.ds-btn-destructive{background:var(--failure);color:#fff}
.ds-btn:active{filter:brightness(.93)}
.ds-card{background:var(--surface-card);border-radius:var(--radius-card);
  border:var(--border-field) solid var(--system-gray3);box-shadow:var(--shadow-card);padding:18px}
.ds-info{display:flex;gap:14px;background:var(--brand-10);padding:16px;align-items:flex-start;color:var(--text-primary)}
.ds-info-ic{width:26px;height:26px;flex:none;margin-top:2px;display:flex;color:var(--brand)}
.ds-info-t{font:700 var(--ios-body) var(--font-family);margin:0 0 4px}
.ds-info-m{font:400 var(--ios-callout) var(--font-family);margin:0;color:var(--text-secondary);line-height:1.4}
.ds-offline{width:100%;background:rgba(161,16,0,.12);color:var(--failure);
  font:500 var(--ios-caption) var(--font-family);text-align:center;padding:3px 0}
.ds-radio{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:#fff;border:var(--border-field) solid var(--system-gray3);cursor:pointer}
.ds-radio.is-sel{background:var(--brand);border:none}
.ds-radio-dot{width:8px;height:8px;border-radius:50%;background:#fff}
.ds-check{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#fff;border:var(--border-field) solid var(--system-gray3);cursor:pointer}
.ds-check.is-ck{background:var(--brand);border:none}
.ds-alert-scrim{position:absolute;inset:0;background:var(--scrim-alert);display:flex;align-items:flex-end;
  justify-content:center;padding:16px;z-index:40}
.ds-alert{width:100%;max-width:420px;background:var(--system-gray5);border-radius:var(--radius-lg);
  display:flex;flex-direction:column;gap:20px;padding:24px 20px 20px;color:var(--text-primary);
  animation:up .3s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.ds-alert-head{display:flex;flex-direction:column;gap:8px;text-align:left}
.ds-alert-head h2{font:700 var(--ios-title2) var(--font-family);margin:0}
.ds-alert-msg{font:400 var(--ios-callout) var(--font-family);color:var(--text-secondary);margin:0;line-height:1.4}
.ds-alert-sep{height:.5px;background:var(--separator)}
.ds-alert-actions{display:flex;gap:10px}
.ds-alert-actions.is-stacked{flex-direction:column}
.ds-alert-actions .ds-btn{flex:1}
.qr-slot{display:inline-flex}



/* ---- panel oculto para la demo: 4 toques en la esquina superior derecha ---- */
#corner{position:absolute;top:0;right:0;width:64px;height:64px;z-index:70;pointer-events:none}
#dev{position:absolute;inset:0;background:rgba(6,12,18,.93);color:#DCE7EF;z-index:80;
  display:none;flex-direction:column;padding:calc(18px + var(--top)) 18px calc(18px + var(--bot));
  overflow:auto;font:400 14px var(--font-family);backdrop-filter:blur(6px)}
#dev.on{display:flex}
#dev h3{font:600 11px var(--font-family);letter-spacing:1.6px;text-transform:uppercase;color:#7E93A5;margin:0 0 10px}
#dev .row{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.sw{width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.18s}
.sw.on{background:#63C0E8}
.sw.on::after{transform:translateX(17px)}
.dg{margin:14px 0 0}
.dg h4{font:600 10.5px var(--font-family);letter-spacing:1.4px;text-transform:uppercase;color:#63C0E8;margin:0 0 6px}
.dj{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:0;color:#DCE7EF;
  font:400 13.5px var(--font-family);padding:9px 12px;border-radius:9px;margin-bottom:5px}
#devclose{margin-top:18px;background:#63C0E8;color:#06202F;border:0;border-radius:999px;
  padding:12px;font:600 14px var(--font-family)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--bot));z-index:65;
  max-width:88%;text-align:center;font:500 12.5px var(--font-family);color:#fff;
  background:rgba(28,28,30,.82);border-radius:999px;padding:8px 16px;
  transition:opacity .6s;pointer-events:none}
#hint:empty{display:none}
#hint.off{opacity:0}
</style>

const OVERLAY = {"A2": "A", "A3": "A", "F": "E", "G": "E"};
const state = {verificado:true, online:true, nfcError:false, paseGuardado:false};
// pantallas que cambian de aspecto según lo que ya haya hecho el usuario
const VARIANTE = { B: () => state.paseGuardado ? 'B3' : 'B' };
const ACT = {
  activar: () => go(state.verificado ? 'A3' : 'A2'),
  verificar: () => toast('Irías a Cl@ve / certificado digital'),
  qr: () => go(state.online ? 'I' : 'J'),
  guardarPase: () => { state.paseGuardado = true; replace('B2'); },
  'qr-retry': () => {
    if(!state.online) return toast('Sigues sin conexión');
    history.replaceState({n:stack.length}, '');
    render('I','fade');
  },
};
let current=null, stack=[], timers=[], toastT=null, taps=0, tapT=null;
const $ = s => document.querySelector(s);
const app=$('#app'), screen=$('#screen');

/* ---------- pantalla completa / hora real ---------- */
const standalone = window.matchMedia('(display-mode: standalone)').matches
  || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
if(standalone) document.body.classList.add('fullscreen');
function clock(){
  const d=new Date();
  screen.querySelectorAll('[data-clock]').forEach(e=>{
    e.textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  });
}

/* ---------- QR ---------- */
function qrSVG(size, semilla){
  const n=25, cell=9; let r='';
  const inF=(i,j)=>(i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    if(inF(i,j))continue;
    const h=(i*73856093)^(j*19349663)^(semilla*83492791);
    if((h>>>3)%2===0) r+=`<rect x="${i*cell}" y="${j*cell}" width="${cell}" height="${cell}" fill="#1C1C1E"/>`;
  }
  const f=(x,y)=>{r+=`<rect x="${x*cell}" y="${y*cell}" width="${cell*7}" height="${cell*7}" fill="#1C1C1E"/>`
    +`<rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${cell*5}" height="${cell*5}" fill="#fff"/>`
    +`<rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${cell*3}" height="${cell*3}" fill="#1C1C1E"/>`};
  f(0,0);f(n-7,0);f(0,n-7);
  return `<svg viewBox="0 0 ${n*cell} ${n*cell}" width="${size}" height="${size}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la tarjeta ciudadana">${r}</svg>`;
}

const clearTimers=()=>{timers.forEach(clearTimeout);timers.forEach(clearInterval);timers=[]};
const later=(f,ms)=>timers.push(setTimeout(f,ms));
let loadT=null;
function loading(titulo, pie, ms, luego){
  const l=$('#load');
  l.querySelector('b').textContent = titulo;
  l.querySelector('i').textContent = pie;
  l.classList.add('on');
  clearTimeout(loadT);
  loadT = setTimeout(()=>{ l.classList.remove('on'); luego(); }, ms);
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- render ---------- */
function render(id, dir){
  const real = (VARIANTE[id] && VARIANTE[id]()) || id;
  const sc = SCREENS[real]; if(!sc) return;
  clearTimers(); clearTimeout(toastT); $('#toast').classList.remove('on');
  $('#load').classList.remove('on');
  current = id;
  screen.className=''; screen.innerHTML='';
  void screen.offsetWidth;
  screen.classList.add(dir==='back'?'in-back':dir==='fade'?'in-fade':'in-fwd');

  const baseId = OVERLAY[real];
  if(baseId && SCREENS[baseId]){
    const base = SCREENS[baseId];
    app.style.background = base.bg; app.style.color = base.fg;
    screen.innerHTML = base.html;
    screen.querySelectorAll('[data-go]').forEach(e=>{e.removeAttribute('data-go');e.classList.remove('hs')});
    const tmp=document.createElement('div'); tmp.innerHTML=sc.html;
    const layer = tmp.querySelector('.ds-alert-scrim')
      || [...tmp.querySelectorAll('div')].find(d=>(d.getAttribute('style')||'').includes('justify-content:flex-end'));
    if(layer){
      const wrap=document.createElement('div');
      wrap.style.cssText='position:absolute;inset:0;z-index:50;display:flex;flex-direction:column';
      wrap.appendChild(layer); screen.appendChild(wrap);
      if(!layer.classList.contains('ds-alert-scrim'))
        layer.addEventListener('click', ev=>{ if(ev.target===layer) goBack(); });
    } else { screen.innerHTML=sc.html; app.style.background=sc.bg; app.style.color=sc.fg; }
  } else {
    app.style.background = sc.bg; app.style.color = sc.fg;
    screen.innerHTML = sc.html;
  }
  document.querySelector('meta[name=theme-color]').setAttribute('content',
    sc.bg.startsWith('#') ? sc.bg : '#FAFAFA');
  clock();

  screen.querySelectorAll('[data-qr="static"]').forEach(e=> e.innerHTML=qrSVG(240,3));
  const live = screen.querySelector('[data-qr="live"]');
  if(live){
    let s=45;
    const paint=()=>{ live.innerHTML=qrSVG(240,(s%5)+1);
      const x=screen.querySelector('[data-qr-secs]'); if(x) x.textContent=s;
      const b=screen.querySelector('[data-qr-bar]'); if(b) b.style.width=Math.round(s/45*100)+'%'; };
    paint(); timers.push(setInterval(()=>{ s=s<=1?45:s-1; paint(); },1000));
  }

  screen.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ev=>{ ev.stopPropagation(); act(el.dataset.go); });
  });

  if(real==='L'){
    later(()=>{
      const st=[...screen.querySelectorAll('span')].filter(s=>s.textContent.trim()==='Completado');
      if(st[0]) st[0].parentElement.style.opacity=1;
    },1800);
    later(()=>{
      if(state.nfcError) go('M');
      else { go('C'); later(()=>toast('Tarjeta actualizada correctamente'),260); }
    },3400);
  }
}

/* ---------- navegación con historial real del navegador ---------- */
function go(id){
  if(!SCREENS[id]) return;
  stack.push(current);
  history.pushState({n:stack.length}, '');
  render(id,'fwd');
  hideHint();
}
let volviendo = false;
function goBack(){
  if(volviendo || !stack.length) return;
  volviendo = true;
  setTimeout(()=>volviendo=false, 350);
  history.back();
}
window.addEventListener('popstate', ()=>{
  if(stack.length){ const p=stack.pop(); render(p,'back'); return; }
  // en la primera pantalla el gesto de atrás no hace nada: la demo no se cierra sola
  history.pushState({n:0}, '');
});
function replace(id){
  if(!SCREENS[id]) return;
  history.replaceState({n:stack.length}, '');
  render(id,'fwd');
}
function reset(to){
  stack=[]; state.paseGuardado=false;
  history.replaceState({n:0},''); render(to||'3a','fade');
}

function act(a){
  if(!a) return;
  if(a==='menu'){ toast('Volverías al menú principal de la app'); return; }
  if(a.startsWith('go:')) return go(a.slice(3));
  if(a.startsWith('rep:')) return replace(a.slice(4));
  if(a.startsWith('ret:')){ return stack.length ? goBack() : go(a.slice(4)); }
  if(a.startsWith('toast:')) return toast(a.slice(6));
  if(a.startsWith('act:')){ const f=ACT[a.slice(4)]; if(f) return f(); }
  if(a==='act:qr') return go(state.online?'I':'J');
  if(SCREENS[a]) go(a);
}

/* ---------- gesto de volver desde el borde ---------- */
let tx=0, ty=0, edge=false;
app.addEventListener('touchstart', e=>{
  const t=e.touches[0]; tx=t.clientX; ty=t.clientY;
  edge = tx < 34;
}, {passive:true});
app.addEventListener('touchend', e=>{
  if(!edge) return;
  const t=e.changedTouches[0];
  if(t.clientX-tx > 65 && Math.abs(t.clientY-ty) < 60) goBack();
  edge=false;
}, {passive:true});

/* esquina superior derecha:
   · tres toques seguidos  -> vuelve a "Activar mi tarjeta"
   · pulsación larga       -> abre el panel de la demo            */
const enEsquina = (x,y)=>{
  const r=app.getBoundingClientRect();
  return x > r.right-64 && x < r.right && y > r.top && y < r.top+64;
};
let pressT=null, tragarClic=false;
document.addEventListener('pointerdown', ev=>{
  if(!enEsquina(ev.clientX, ev.clientY)) return;
  clearTimeout(pressT);
  pressT = setTimeout(()=>{
    tragarClic = true; taps = 0;
    $('#dev').classList.add('on');
  }, 750);
}, true);
['pointerup','pointercancel','pointermove'].forEach(t=>
  document.addEventListener(t, ()=>clearTimeout(pressT), true));
document.addEventListener('click', ev=>{
  if(tragarClic){ tragarClic=false; ev.stopPropagation(); ev.preventDefault(); return; }
  if(!enEsquina(ev.clientX, ev.clientY)){ taps=0; return; }
  taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,900);
  if(taps>=3){ taps=0; ev.stopPropagation(); ev.preventDefault(); reset('A'); }
}, true);
$('#devclose').onclick = ()=> $('#dev').classList.remove('on');
document.querySelectorAll('.sw').forEach(sw=>{
  sw.parentElement.addEventListener('click', e=>{
    e.preventDefault();
    sw.classList.toggle('on'); state[sw.dataset.opt]=sw.classList.contains('on');
  });
});
document.querySelectorAll('.dj').forEach(b=>{
  b.onclick = ()=>{ $('#dev').classList.remove('on'); reset(b.dataset.s); };
});

/* ---------- pista inicial ---------- */
let hintT=setTimeout(()=>$('#hint').classList.add('off'), 5000);
function hideHint(){ clearTimeout(hintT); $('#hint').classList.add('off'); }
